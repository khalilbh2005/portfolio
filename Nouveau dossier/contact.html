<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Khalil Ben Hamza</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Khalil<span>.</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="index.html#about">À propos</a></li>
            <li><a href="index.html#projects">Projets</a></li>
            <li><a href="#" class="active-link" style="color:var(--soft-gold);">Contact</a></li>
        </ul>
        <div class="burger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
    </nav>

    <section class="contact-section">
        <div class="contact-container">
            
            <div class="col-left">
                <div class="light-beam"></div>
                <img src="assets/images/hero/Khalilou.png" alt="Khalil Ben Hamza" class="portrait-img">
            </div>

            <div class="col-right">
                <div class="form-header">
                    <h1>Entrons en contact.</h1>
                    <p>Une idée ? Un projet ? Je réponds à chaque message avec attention.</p>
                </div>

                <form action="https://formsubmit.co/m.khalilbenhamza@gmail.com" method="POST" class="glass-form">
                    
                    <input type="hidden" name="_next" value="https://khalil-portfolio.com/index.html"> 
                    <input type="hidden" name="_subject" value="🚀 Nouveau message Portfolio !">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="text" name="_honey" style="display:none"> <input type="hidden" name="_autoresponse" value="Merci pour votre message ! Je vous répondrai très vite. Khalil.">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Nom & Prénom</label>
                            <input type="text" id="name" name="name" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="type">Vous êtes ?</label>
                            <select id="type" name="contact_type">
                                <option value="Entreprise">Une Entreprise</option>
                                <option value="Individu">Un Particulier</option>
                                <option value="Association">Une Association</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email professionnel</label>
                        <input type="email" id="email" name="email" placeholder="nom@exemple.com" required>
                    </div>

                    <div class="form-group">
                        <label for="company">Nom de l'entreprise (Optionnel)</label>
                        <input type="text" id="company" name="company" placeholder="Ex: Tesla, Startup...">
                    </div>

                    <div class="form-group">
                        <label for="subject">Objet du message</label>
                        <select id="subject" name="object_message">
                            <option value="Offre Alternance">Offre d’alternance</option>
                            <option value="Collaboration">Collaboration / Projet</option>
                            <option value="Information">Demande d’information</option>
                            <option value="Event">Intervention / Événement</option>
                            <option value="Autre">Autre</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Votre message</label>
                        <textarea id="message" name="message" placeholder="Dites-m'en plus sur vos besoins..." required></textarea>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="consent" name="consent" required>
                        <label for="consent">J’accepte que mes informations soient utilisées pour être recontacté.</label>
                    </div>

                    <button type="submit" class="btn-submit">Envoyer le message</button>
                </form>
            </div>
        </div>
    </section>

    <script src="js/slider.js"></script>
</body>
</html>
